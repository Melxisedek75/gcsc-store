services:
  - type: web
    name: gcsc-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: GCSC_TOKEN_CONTRACT
        value: gscsmartct1
      - key: XPR_RPC_ENDPOINT
        value: https://proton.eoscafeblock.com
